# Configuración de correo saliente (SMTP), usando Gmail como proveedor.

# IMPORTANTE - seguridad:
# NUNCA pongas el email/contraseña reales directamente en este archivo si
# vas a subirlo a un repositorio público o compartido. Usa variables de
# entorno (${MAIL_USERNAME} / ${MAIL_PASSWORD}) y añade application.properties
# a .gitignore ANTES de hacer el primer commit 

# Para Gmail: necesitas la verificación en dos pasos activada, y generar una
# "contraseña de aplicación" en myaccount.google.com/apppasswords (no vale
# tu contraseña normal de la cuenta).

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
