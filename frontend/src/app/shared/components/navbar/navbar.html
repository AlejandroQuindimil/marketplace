<nav class="navbar">
  <a routerLink="/" class="nav-logo">DRIP</a>

  <div class="nav-categorias">
    <a routerLink="/productos" [queryParams]="{genero: ''}">Novedades</a>

    
    <a *ngFor="let genero of generos"
      routerLink="/productos"
      [queryParams]="{genero: genero.valor}"
      (mouseenter)="abrirSubmenu(genero.valor)"
      (mouseleave)="cerrarSubmenuConRetraso()">
      {{ genero.label }}
    </a>

    <a routerLink="/productos" [queryParams]="{categoria: 'ACCESORIOS'}">Accesorios</a>
    <a routerLink="/productos" [queryParams]="{genero: '', rebajas: 'true'}" class="nav-rebajas">Rebajas</a>
  </div>

  <div class="nav-buscador">
    <input
      type="text"
      placeholder="Buscar productos..."
      [(ngModel)]="busqueda"
      (keyup.enter)="buscar()">
    <button (click)="buscar()">
      <lucide-icon [img]="SearchIcon" [size]="16"></lucide-icon>
    </button>
  </div>

  <div class="nav-iconos">
    <ng-container *ngIf="usuario; else noLogueado">
      <div class="usuario-menu-wrapper">
        <button class="icono-link" (click)="toggleMenu()" title="Tu cuenta">
          <lucide-icon [img]="UserIcon" [size]="20"></lucide-icon>
          <span class="icono-texto">{{ usuario.nombre }}</span>
        </button>

        <div class="usuario-dropdown" *ngIf="menuAbierto">
          <a routerLink="/perfil" [queryParams]="{tab: 'perfil'}" (click)="cerrarMenu()">Tu perfil</a>
          <a routerLink="/perfil" [queryParams]="{tab: 'pedidos'}" (click)="cerrarMenu()">Pedidos</a>
          <a routerLink="/perfil" [queryParams]="{tab: 'devoluciones'}" (click)="cerrarMenu()">Devolver artículo</a>
          <a routerLink="/perfil" [queryParams]="{tab: 'tallas'}" (click)="cerrarMenu()">Tus tallas</a>
          <a routerLink="/perfil" [queryParams]="{tab: 'ayuda'}" (click)="cerrarMenu()">Ayuda y contacto</a>
          <hr>
          <a class="dropdown-logout" (click)="logout()">¿No eres {{ usuario.nombre }}? Cerrar sesión</a>
        </div>
      </div>
    </ng-container>
    <ng-template #noLogueado>
      <a routerLink="/login" class="icono-link" title="Iniciar sesión">
        <lucide-icon [img]="UserIcon" [size]="20"></lucide-icon>
      </a>
    </ng-template>

    <a routerLink="/favoritos" class="icono-link" title="Favoritos">
      <lucide-icon [img]="HeartIcon" [size]="20"></lucide-icon>
    </a>

    <a routerLink="/carrito" class="icono-link icono-carrito" title="Cesta">
      <lucide-icon [img]="CartIcon" [size]="20"></lucide-icon>
      <span class="badge-carrito" *ngIf="carritoService.contador() > 0">
        {{ carritoService.contador() > 10 ? '+10' : carritoService.contador() }}
      </span>
    </a>
  </div>
</nav>

<div
  class="mega-menu"
  *ngIf="generoAbierto"
  (mouseenter)="abrirSubmenu(generoAbierto)"
  (mouseleave)="cerrarSubmenuInmediato()">
  
  <a *ngFor="let cat of categorias"
    routerLink="/productos"
    [queryParams]="{genero: generoAbierto, categoria: cat.valor}"
    (click)="cerrarSubmenuInmediato()">
    {{ cat.label }}
  </a>
</div>
